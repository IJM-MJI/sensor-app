<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sensor Data</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:#f5f5f5;color:#222;
  max-width:480px;margin:0 auto;
  -webkit-user-select:none;user-select:none;
}
.header{
  background:#fff;text-align:center;padding:14px;
  font-size:20px;font-weight:700;
  border-bottom:1px solid #e0e0e0;
  position:sticky;top:0;z-index:10;
}
.cam-wrap{
  position:relative;width:100%;
  aspect-ratio:1;background:#000;overflow:hidden;
}
.cam-wrap video,.cam-wrap img{
  width:100%;height:100%;object-fit:cover;display:block;
}
.cam-wrap canvas{display:none}
#capturedImg{display:none}
#dbgCvs{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;display:none}
.shutter-area{
  display:flex;justify-content:center;align-items:center;
  padding:16px;background:#111;gap:20px;
}
.shutter{
  width:70px;height:70px;border-radius:50%;
  border:4px solid #fff;background:transparent;
  cursor:pointer;position:relative;
}
.shutter::after{
  content:'';position:absolute;
  top:4px;left:4px;right:4px;bottom:4px;
  border-radius:50%;background:#fff;
  transition:transform .1s;
}
.shutter:active::after{transform:scale(0.85)}
.retake{
  padding:12px 24px;border:none;border-radius:8px;
  background:#444;color:#fff;font-size:15px;cursor:pointer;
}
.card{
  background:#fff;margin:8px 14px;border-radius:12px;
  padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.1);
}
.card h3{font-size:13px;color:#888;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.state-row{display:flex;align-items:center;gap:10px}
.dot{width:14px;height:14px;border-radius:50%;flex-shrink:0}
.state-name{font-size:20px;font-weight:700}
.conf{font-size:13px;color:#888;margin-left:24px}
.row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #f0f0f0}
.row:last-child{border-bottom:none}
.lbl{font-size:15px;color:#555}
.val{font-size:17px;font-weight:600}
.status-row{display:flex;align-items:center;gap:8px;padding:8px 0}
.status-dot{width:10px;height:10px;border-radius:50%}
.status-txt{font-size:14px;font-weight:500}
.hidden{display:none!important}
.loading{text-align:center;padding:80px 20px;color:#888}
.spin{
  display:inline-block;width:40px;height:40px;
  border:4px solid #e0e0e0;border-top-color:#2196F3;
  border-radius:50%;animation:sp .7s linear infinite;
}
@keyframes sp{to{transform:rotate(360deg)}}
.proc-overlay{
  position:absolute;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.5);display:flex;
  align-items:center;justify-content:center;
  color:#fff;font-size:16px;flex-direction:column;gap:12px;
}
.dbg{font-size:11px;color:#999;padding:4px 14px;word-break:break-all}
.cal-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;background:#fff;border-bottom:1px solid #e0e0e0;
}
.cal-status{font-size:13px;color:#888}
.cal-status.active{color:#2e7d32;font-weight:600}
.cal-btn{
  padding:8px 16px;border:none;border-radius:8px;
  font-size:13px;font-weight:600;cursor:pointer;
}
.cal-btn.calibrate{background:#2196F3;color:#fff}
.cal-btn.clear{background:#eee;color:#666;font-size:12px}
.roi-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 14px;background:#fff;border-bottom:1px solid #e0e0e0;
}
.roi-bar label{font-size:13px;color:#888}
.roi-bar .roi-btn{
  padding:6px 14px;border:none;border-radius:8px;
  font-size:13px;font-weight:600;cursor:pointer;
  background:#FF9800;color:#fff;
}
.roi-bar .roi-btn.active{background:#e65100}
.roi-bar .roi-btn.set{background:#4CAF50}
#roiGuide{
  position:absolute;top:0;left:0;width:100%;height:100%;
  display:none;z-index:5;cursor:crosshair;
}
#roiOverlay{
  position:absolute;top:0;left:0;width:100%;height:100%;
  pointer-events:none;z-index:4;display:none;
}
.roi-slider{display:none;padding:6px 14px;background:#fff;border-bottom:1px solid #e0e0e0}
.roi-slider input{width:100%}
.roi-slider span{font-size:12px;color:#888}
</style>
</head>
<body>

<div class="header">Sensor Data</div>

<div id="loadingScreen" class="loading">
  <div class="spin"></div>
  <p style="margin-top:16px">Loading OpenCV.js...</p>
  <p style="margin-top:8px;font-size:13px;color:#aaa">First load may take 10-20 seconds</p>
</div>

<div id="app" class="hidden">
  <div class="cal-bar" id="calBar" style="display:none">
    <span class="cal-status" id="calStatus">Not calibrated</span>
    <span>
      <button class="cal-btn clear hidden" id="calClearBtn" onclick="clearCal()">Reset</button>
      <button class="cal-btn calibrate" id="calBtn" onclick="startCal()">Re-calibrate</button>
    </span>
  </div>
  <div class="roi-bar" style="display:none">
    <label id="roiStatus">ROI: Auto</label>
    <span>
      <button class="roi-btn clear hidden" id="roiClearBtn" onclick="clearROI()">Reset</button>
      <button class="roi-btn" id="roiBtn" onclick="startROI()">Set ROI</button>
    </span>
  </div>
  <div class="roi-slider hidden" id="roiSliderWrap">
    <span>Radius: <span id="roiRadLabel">30%</span></span>
    <input type="range" id="roiSlider" min="10" max="45" value="30" oninput="updateROIRadius(this.value)">
  </div>
  <div class="cam-wrap" id="camWrap">
    <video id="vid" autoplay playsinline muted></video>
    <img id="capturedImg">
    <canvas id="cvs"></canvas>
    <canvas id="dbgCvs"></canvas>
    <canvas id="roiOverlay"></canvas>
    <div id="roiGuide"></div>
    <div id="procOverlay" class="proc-overlay hidden">
      <div class="spin"></div>
      <span>Analyzing...</span>
    </div>
    <div id="calOverlay" style="position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5">
      <div style="color:#fff;font-size:18px;font-weight:700;margin-bottom:8px">Calibration Required</div>
      <div style="color:#ccc;font-size:14px;margin-bottom:16px;text-align:center;padding:0 20px">Point camera at sensor in initial state (no gas)</div>
      <button onclick="doCalCapture()" id="calCaptureBtn" style="padding:14px 36px;border:none;border-radius:12px;background:#2196F3;color:#fff;font-size:16px;font-weight:700;cursor:pointer;opacity:0.3;pointer-events:none">Calibrate</button>
    </div>
  </div>

  <div class="shutter-area">
    <button class="retake hidden" id="retakeBtn" onclick="retake()">Retake</button>
    <button class="shutter" id="shutterBtn" onclick="capture()" style="opacity:0.3;pointer-events:none"></button>
    <div id="stabilizeMsg" style="color:#fff;font-size:13px;position:absolute;bottom:4px;width:100%;text-align:center;pointer-events:none">Camera stabilizing...</div>
  </div>

  <div id="resArea" class="hidden">
    <div class="card">
      <h3>Current Reading</h3>
      <div class="state-row">
        <div class="dot" id="sDot" style="background:#999"></div>
        <div class="state-name" id="sName">-</div>
      </div>
      <div class="conf" id="sConf"></div>
    </div>
    <div class="card">
      <h3>Concentration</h3>
      <div class="row">
        <span class="lbl">H&#8322;</span>
        <span class="val" id="h2Val">-</span>
      </div>
      <div class="row">
        <span class="lbl">Humidity</span>
        <span class="val" id="rhVal">-</span>
      </div>
    </div>
    <div class="card">
      <div class="status-row">
        <div class="status-dot" id="stDot" style="background:#999"></div>
        <span class="status-txt" id="stTxt">-</span>
      </div>
    </div>
    <button id="copyBtn" onclick="copyResult()" style="width:100%;padding:10px;margin-top:4px;border:none;border-radius:8px;background:#333;color:#fff;font-size:14px;cursor:pointer">Copy Result</button>
  </div>
  <div class="dbg" id="dbg"></div>
</div>

<script>
// ===== CLASSIFIER v5 (top-chroma percentile + calibration delta) =====
// Default baseline from training data initial state (H2_only videos, h2<0.3%)
var BL_DEFAULT={
  flame_L:129.8,flame_a:119.1,flame_b:159.3,
  drop_L:132.8,drop_a:123.1,drop_b:145.6,
  bg_L:126.9,bg_a:127.4,bg_b:133.5,
  top_L:129.0,top_a:118.1,top_b:163.0
};
var BL=JSON.parse(JSON.stringify(BL_DEFAULT));
var calibrated=false;
var calMode=false;

function loadCal(){}

function saveCal(feat){
  for(var k in BL_DEFAULT) if(feat[k]!=null) BL[k]=feat[k];
  calibrated=true;
  updateCalUI();
}

function clearCal(){
  BL=JSON.parse(JSON.stringify(BL_DEFAULT));
  calibrated=false;
  manualROI=null;
  updateCalUI();
  var co=document.getElementById('calOverlay');if(co) co.style.display='';
  document.getElementById('calBar').style.display='none';
  var sb=document.getElementById('shutterBtn');
  sb.style.opacity='0.3';sb.style.pointerEvents='none';
  clearROI();
}

function updateCalUI(){
  var st=document.getElementById('calStatus');
  var btn=document.getElementById('calBtn');
  var clr=document.getElementById('calClearBtn');
  if(calibrated){
    st.textContent='Calibrated (top_a='+BL.top_a.toFixed(1)+')';
    st.className='cal-status active';
    btn.textContent='Re-calibrate';
    clr.classList.remove('hidden');
  }else{
    st.textContent='Not calibrated';
    st.className='cal-status';
    btn.textContent='Calibrate';
    clr.classList.add('hidden');
  }
}

function startCal(){
  clearCal();
}

function h2Score(f){
  var d_bg_a=BL.bg_a-f.bg_a;
  var d_top_a=(BL.top_a-f.top_a)-d_bg_a;
  var d_flame_a=(BL.flame_a-f.flame_a)-d_bg_a;
  var d_drop_a=(BL.drop_a-f.drop_a)-d_bg_a;
  var flame_only=Math.max(0,d_flame_a-d_drop_a);
  var shift_b_delta=(f.flame_b-f.bg_b)-(BL.flame_b-BL.bg_b);
  var h2o_penalty=Math.max(0,shift_b_delta)*0.1;
  return d_top_a*2.0+d_flame_a*1.0+flame_only*0.5-h2o_penalty;
}

function h2oScore(f){
  var d_bg_a=BL.bg_a-f.bg_a;
  var d_bg_b=BL.bg_b-f.bg_b;
  var pink=Math.max(0,(f.top_a-BL.top_a)+d_bg_a)+Math.max(0,(f.flame_a-BL.flame_a)+d_bg_a);
  var blue=Math.max(0,(BL.drop_b-f.drop_b)-d_bg_b);
  return pink*1.5+blue*1.0;
}

function doClassify(f){
  var h2S=h2Score(f);
  var h2oS=h2oScore(f);

  var H2_T=5.0;
  var cur_hue=(f.top_b-f.top_a+f.drop_b-f.drop_a)/2;
  var bl_hue=(BL.top_b-BL.top_a+BL.drop_b-BL.drop_a)/2;
  var bgs=(BL.bg_b-BL.bg_a)-(f.bg_b-f.bg_a);
  var hd=bl_hue-cur_hue-bgs;
  var dropS=Math.max(0,(f.drop_a-BL.drop_a)+(BL.bg_a-f.bg_a));

  var xt=Math.max(0,h2S-1.0)*0.4;
  var hd_c=hd-xt;
  var dropS_c=Math.max(0,dropS-xt);
  var h2oS_c=Math.max(0,h2oS-xt*2.5);

  var h2o_real=hd_c>6||dropS_c>=5.5;

  if(h2S<-10&&!h2o_real){
    return{state:'no_sample',conf:'-',h2:null,rh:null,h2S:Math.round(h2S*10)/10,h2oS:Math.round(h2oS*10)/10,hd:Math.round(hd_c*10)/10,dropS:Math.round(dropS_c*10)/10,bgs:Math.round(bgs*10)/10,rs:'-',xt:Math.round(xt*10)/10};
  }

  var rs=hd_c+(dropS_c>=5.5?3:0)+(h2oS_c>=12?3:0);
  var h2o_sig=h2o_real&&rs>3.5;

  var state;
  if(h2S>=H2_T&&h2o_sig) state='H2+RH';
  else if(h2o_sig) state='H2O_only';
  else if(h2S>=H2_T) state='H2_only';
  else state='initial';

  var h2=null,rh=null;
  if(state==='H2_only'||state==='H2+RH'){
    var da=(BL.top_a-f.top_a)-(BL.bg_a-f.bg_a);
    if(da<0.5) h2='<1%';
    else if(da<1.5) h2='~1%';
    else if(da<3.0) h2='~2%';
    else if(da<4.5) h2='~3%';
    else h2='~4%';
  }
  if(state==='H2O_only'||state==='H2+RH'){
    if(rs>15) rh='≥80%';
    else if(rs>11) rh='~70%';
    else if(rs>8) rh='~60%';
    else if(rs>5.5) rh='~50%';
    else rh='~40%';
  }

  var conf;
  if(state==='initial'&&h2S<0.5&&hd_c<3&&hd_c>-3) conf='high';
  else if(state==='H2_only'&&h2S>3.0) conf='high';
  else if(state==='H2O_only'&&(hd_c>12||dropS_c>=5)) conf='high';
  else if(state==='H2+RH'&&h2S>2.0&&(hd_c>12||dropS_c>=5)) conf='high';
  else if(state!=='initial') conf='medium';
  else conf='low';

  return{state:state,conf:conf,h2:h2,rh:rh,h2S:Math.round(h2S*10)/10,h2oS:Math.round(h2oS*10)/10,hd:Math.round(hd_c*10)/10,dropS:Math.round(dropS_c*10)/10,bgs:Math.round(bgs*10)/10,rs:Math.round(rs*10)/10,xt:Math.round(xt*10)/10};
}

// ===== UI =====
var SC={no_sensor:'#999',no_sample:'#ff9800',initial:'#66bb6a',H2_only:'#ef5350',H2O_only:'#42a5f5','H2+RH':'#ab47bc'};
var SN={no_sensor:'No Sensor Detected',no_sample:'No Sample Detected',initial:'Initial State',H2_only:'H₂ Detection',H2O_only:'Humidity Detection','H2+RH':'Simultaneous Detection'};
var SM={no_sensor:['Sensor not found','#999'],no_sample:['Sample not visible — check lighting','#ff9800'],initial:['Status: Standby','#66bb6a'],H2_only:['Warning: H₂ Detected','#ef5350'],H2O_only:['High Humidity Detected','#42a5f5'],'H2+RH':['H₂ + Humidity Detected','#ab47bc']};

var lastResultText='';
function showResult(r){
  document.getElementById('resArea').classList.remove('hidden');
  document.getElementById('sDot').style.background=SC[r.state]||'#999';
  document.getElementById('sName').textContent=SN[r.state]||r.state;
  var cm={high:'High Confidence',medium:'Medium Confidence',low:'Low Confidence'};
  var vals='H2='+r.h2S+' H2O='+r.h2oS+' hd='+r.hd+' drop='+r.dropS+' bgs='+r.bgs+' rs='+r.rs+(r.xt?' xt='+r.xt:'');
  lastResultText=(SN[r.state]||r.state)+' | '+vals+(r.h2?' | '+r.h2:'')+(r.rh?' | '+r.rh:'');
  document.getElementById('sConf').innerHTML=(cm[r.conf]||'')+'<br><span style="font-size:13px;font-family:monospace">'+vals+'</span>';
  var h2E=document.getElementById('h2Val');
  if(r.state==='no_sample'||r.state==='no_sensor'){h2E.textContent='-';h2E.style.color='#999';}
  else if(r.h2){h2E.textContent=r.h2+' (Below LEL)';h2E.style.color='#ef5350';}
  else{h2E.textContent='Not Detected';h2E.style.color='#222';}
  var rhE=document.getElementById('rhVal');
  if(r.state==='no_sample'||r.state==='no_sensor'){rhE.textContent='-';rhE.style.color='#999';}
  else if(r.rh){rhE.textContent=r.rh;rhE.style.color='#42a5f5';}
  else{rhE.textContent='Normal';rhE.style.color='#222';}
  var msg=SM[r.state]||['Unknown','#999'];
  document.getElementById('stDot').style.background=msg[1];
  document.getElementById('stTxt').textContent=msg[0];
  document.getElementById('stTxt').style.color=msg[1];
}
function copyResult(){
  if(lastResultText){
    navigator.clipboard.writeText(lastResultText).then(function(){
      var b=document.getElementById('copyBtn');
      b.textContent='Copied!';setTimeout(function(){b.textContent='Copy Result';},1500);
    }).catch(function(){});
  }
}

// ===== MANUAL ROI =====
var manualROI=null; // {cx:0-1, cy:0-1, rPct:30} percentage-based
var roiMode=false;

function loadROI(){}

function saveROI(){
  updateROIUI();
}

function clearROI(){
  manualROI=null;
  roiMode=false;
  updateROIUI();
  document.getElementById('roiGuide').style.display='none';
  document.getElementById('roiOverlay').style.display='none';
  document.getElementById('roiSliderWrap').classList.add('hidden');
}

function updateROIUI(){
  var st=document.getElementById('roiStatus');
  var btn=document.getElementById('roiBtn');
  var clr=document.getElementById('roiClearBtn');
  if(manualROI){
    st.textContent='ROI: Manual ('+Math.round(manualROI.rPct)+'%)';
    btn.textContent='Re-set ROI';
    btn.className='roi-btn set';
    clr.classList.remove('hidden');
    drawROIOverlay();
  }else{
    st.textContent='ROI: Auto (HoughCircles)';
    btn.textContent='Set ROI';
    btn.className='roi-btn';
    clr.classList.add('hidden');
  }
}

function startROI(){
  roiMode=true;
  document.getElementById('roiBtn').textContent='Tap sensor center';
  document.getElementById('roiBtn').className='roi-btn active';
  document.getElementById('roiGuide').style.display='block';
  document.getElementById('roiSliderWrap').classList.remove('hidden');
}

function drawROIOverlay(){
  if(!manualROI) return;
  var oc=document.getElementById('roiOverlay');
  var wrap=document.getElementById('camWrap');
  var ww=wrap.clientWidth, wh=wrap.clientHeight;
  oc.width=ww; oc.height=wh;
  oc.style.display='block';
  var ox=oc.getContext('2d');
  ox.clearRect(0,0,ww,wh);
  var cx=manualROI.cx*ww, cy=manualROI.cy*wh;
  var r=manualROI.rPct/100*Math.min(ww,wh);
  ox.strokeStyle='rgba(0,255,0,0.8)';ox.lineWidth=2;
  ox.beginPath();ox.arc(cx,cy,r,0,Math.PI*2);ox.stroke();
  ox.strokeStyle='rgba(0,255,0,0.4)';ox.lineWidth=1;
  ox.beginPath();ox.moveTo(cx-r,cy);ox.lineTo(cx+r,cy);ox.stroke();
  ox.beginPath();ox.moveTo(cx,cy-r);ox.lineTo(cx,cy+r);ox.stroke();
}

document.getElementById('roiGuide').addEventListener('click',function(e){
  if(!roiMode) return;
  var rect=this.getBoundingClientRect();
  var x=(e.clientX-rect.left)/rect.width;
  var y=(e.clientY-rect.top)/rect.height;
  var rVal=parseInt(document.getElementById('roiSlider').value);
  manualROI={cx:x,cy:y,rPct:rVal};
  saveROI();
  drawROIOverlay();
});

function updateROIRadius(val){
  document.getElementById('roiRadLabel').textContent=val+'%';
  if(manualROI){
    manualROI.rPct=parseInt(val);
    saveROI();
    drawROIOverlay();
  }
}

// ===== CAMERA =====
var vid=document.getElementById('vid');
var cvs=document.getElementById('cvs');
var ctx2d=cvs.getContext('2d');
var captured=false;

var camReady=false;
function enableShutter(){
  camReady=true;
  var sb=document.getElementById('shutterBtn');
  if(calibrated){sb.style.opacity='1';sb.style.pointerEvents='auto';}
  var sm=document.getElementById('stabilizeMsg');
  if(sm) sm.style.display='none';
  var cc=document.getElementById('calCaptureBtn');
  if(cc){cc.style.opacity='1';cc.style.pointerEvents='auto';}
}
function doCalCapture(){
  if(!camReady) return;
  calMode=true;
  capture();
}
function initCam(){
  if(vid.srcObject){
    vid.srcObject.getTracks().forEach(function(t){t.stop();});
    vid.srcObject=null;
  }
  navigator.mediaDevices.getUserMedia({
    video:{facingMode:'environment',width:{ideal:1280},height:{ideal:960}}
  }).then(function(stream){
    vid.srcObject=stream; vid.play();
    camReady=false;
    var sb=document.getElementById('shutterBtn');
    sb.style.opacity='0.3';sb.style.pointerEvents='none';
    var sm=document.getElementById('stabilizeMsg');
    if(sm) sm.style.display='';
    setTimeout(enableShutter,3000);
  }).catch(function(e){
    document.getElementById('dbg').textContent='Camera: '+e.message;
  });
}
function resumeCam(){
  if(captured) return;
  var alive=vid.srcObject&&vid.srcObject.getTracks().some(function(t){return t.readyState==='live';});
  if(!alive){
    initCam();
  }else{
    vid.play().catch(function(){});
  }
}
document.addEventListener('visibilitychange',function(){if(!document.hidden) resumeCam();});
window.addEventListener('pageshow',function(){resumeCam();});
window.addEventListener('focus',function(){resumeCam();});

function capture(){
  if(captured||!camReady) return;
  if(!calibrated&&!calMode){
    document.getElementById('dbg').textContent='⚠ Calibrate first: photograph sensor in initial state';
    return;
  }
  var vw=vid.videoWidth, vh=vid.videoHeight;
  if(!vw||!vh) return;
  captured=true;
  document.getElementById('shutterBtn').classList.add('hidden');
  document.getElementById('procOverlay').classList.remove('hidden');
  cvs.width=vw; cvs.height=vh;
  var fi=0, nF=3;
  function grabNext(){
    ctx2d.globalAlpha=1.0/(fi+1);
    ctx2d.drawImage(vid,0,0);
    fi++;
    if(fi<nF){ setTimeout(grabNext,50); }
    else{ ctx2d.globalAlpha=1.0; finishCapture(); }
  }
  grabNext();
}
function finishCapture(){
  var url=cvs.toDataURL('image/jpeg',0.92);
  document.getElementById('capturedImg').src=url;
  document.getElementById('capturedImg').style.display='block';
  document.getElementById('roiOverlay').style.display='none';
  vid.style.display='none';
  document.getElementById('retakeBtn').classList.remove('hidden');
  setTimeout(function(){
    try{
      var r=processFrame();
      if(calMode&&r.state!=='no_sensor'){
        var f=r._raw;
        saveCal(f);
        var g=r._dbgGeo;
        if(g&&g.cx&&g.cy&&g.r){
          manualROI={cx:g.cx/g.w,cy:g.cy/g.h,rPct:Math.round(g.r/Math.min(g.h,g.w)*100)};
          updateROIUI();
          drawROIOverlay();
        }
        calMode=false;
        document.getElementById('calBtn').style.background='#2196F3';
        document.getElementById('dbg').textContent='Calibrated! ROI locked.';
        document.getElementById('procOverlay').classList.add('hidden');
        var co=document.getElementById('calOverlay');if(co) co.style.display='none';
        document.getElementById('calBar').style.display='';
        var sb=document.getElementById('shutterBtn');
        sb.style.opacity='1';sb.style.pointerEvents='auto';
        retake();
        return;
      }
      showResult(r);
      drawDebugOverlay(r);
      document.getElementById('dbg').textContent=r.dbg||'';
    }catch(e){
      document.getElementById('dbg').textContent='Error: '+e.message+' '+e.stack;
      showResult({state:'no_sensor',conf:'-',h2:null,rh:null,h2S:0,h2oS:0});
    }
    document.getElementById('procOverlay').classList.add('hidden');
  },100);
}

function retake(){
  captured=false;
  document.getElementById('capturedImg').style.display='none';
  document.getElementById('dbgCvs').style.display='none';
  vid.style.display='block';
  document.getElementById('retakeBtn').classList.add('hidden');
  document.getElementById('resArea').classList.add('hidden');
  document.getElementById('dbg').textContent='';
  if(calibrated){
    document.getElementById('shutterBtn').classList.remove('hidden');
    document.getElementById('shutterBtn').style.opacity='1';
    document.getElementById('shutterBtn').style.pointerEvents='auto';
  }
  if(manualROI) drawROIOverlay();
  resumeCam();
}

// ===== IMAGE PROCESSING WITH OPENCV.JS =====
function processFrame(){
  var src=cv.imread(cvs);
  var maxP=480;
  var sc=Math.max(src.rows,src.cols)>maxP?maxP/Math.max(src.rows,src.cols):1;
  var proc=new cv.Mat();
  if(sc<1) cv.resize(src,proc,new cv.Size(Math.round(src.cols*sc),Math.round(src.rows*sc)));
  else src.copyTo(proc);
  src.delete();
  var result=detectAndClassify(proc);
  result._scale=sc;
  proc.delete();
  return result;
}

function detectAndClassify(src){
  var h=src.rows, w=src.cols;
  var bCx,bCy,bR,nCircles=0,bBr=255,roiSource='auto';

  if(manualROI){
    // Manual ROI: fixed position
    bCx=Math.round(manualROI.cx*w);
    bCy=Math.round(manualROI.cy*h);
    bR=Math.round(manualROI.rPct/100*Math.min(h,w));
    nCircles=1;
    roiSource='manual';
  }else{
    // Auto: HoughCircles
    var gray=new cv.Mat();
    cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY);
    var blurred=new cv.Mat();
    cv.GaussianBlur(gray,blurred,new cv.Size(9,9),2);
    var minR=Math.round(Math.min(h,w)*0.15);
    var maxR=Math.round(Math.min(h,w)*0.45);
    var circles=new cv.Mat();
    cv.HoughCircles(blurred,circles,cv.HOUGH_GRADIENT,1.2,
      Math.round(Math.min(h,w)/2),80,40,minR,maxR);
    blurred.delete();

    if(circles.cols===0){
      gray.delete(); circles.delete();
      return{state:'no_sensor',conf:'-',h2:null,rh:null,h2S:0,h2oS:0,dbg:'No circular window found'};
    }

    bCx=0;bCy=0;bR=0;bBr=-1;
    for(var i=0;i<circles.cols;i++){
      var cx=Math.round(circles.data32F[i*3]);
      var cy=Math.round(circles.data32F[i*3+1]);
      var r=Math.round(circles.data32F[i*3+2]);
      var ir=Math.round(r*0.5);
      var sum=0,cnt=0;
      for(var dy=-ir;dy<=ir;dy+=3){
        for(var dx=-ir;dx<=ir;dx+=3){
          var px=cx+dx,py=cy+dy;
          if(px>=0&&px<w&&py>=0&&py<h&&dx*dx+dy*dy<=ir*ir){
            sum+=gray.ucharAt(py,px);cnt++;
          }
        }
      }
      var avg=cnt>0?sum/cnt:0;
      if(avg>bBr){bBr=avg;bCx=cx;bCy=cy;bR=r;}
    }
    nCircles=circles.cols;
    circles.delete(); gray.delete();

    if(bBr<80)
      return{state:'no_sensor',conf:'-',h2:null,rh:null,h2S:0,h2oS:0,dbg:'Circle too dark'};
  }

  // 2. Convert to LAB
  var bgr=new cv.Mat();
  cv.cvtColor(src,bgr,cv.COLOR_RGBA2BGR);
  var lab=new cv.Mat();
  cv.cvtColor(bgr,lab,cv.COLOR_BGR2Lab);
  bgr.delete();

  var labData=lab.data;
  var cols=lab.cols;
  var innerR=Math.round(bR*0.90);
  var y1=Math.max(0,bCy-innerR),y2=Math.min(h,bCy+innerR);
  var x1=Math.max(0,bCx-innerR),x2=Math.min(w,bCx+innerR);
  var innerR2=innerR*innerR;

  // 3. Top-chroma percentile extraction
  // Collect all pixels inside sensor circle with their LAB and chroma
  var allPx=[];
  for(var yy=y1;yy<y2;yy++){
    for(var xx=x1;xx<x2;xx++){
      var ddx=xx-bCx,ddy=yy-bCy;
      if(ddx*ddx+ddy*ddy>innerR2) continue;
      var ii=(yy*cols+xx)*3;
      var L=labData[ii],a=labData[ii+1],b=labData[ii+2];
      var ao=a-128,bo=b-128;
      var c=Math.sqrt(ao*ao+bo*bo);
      allPx.push({L:L,a:a,b:b,c:c,x:xx,y:yy});
    }
  }
  lab.delete();

  if(allPx.length<100){
    return{state:'no_sensor',conf:'-',h2:null,rh:null,h2S:0,h2oS:0,dbg:'Too few pixels ('+allPx.length+')'};
  }

  // Sort by chroma for percentile extraction
  allPx.sort(function(a,b){return a.c-b.c;});
  var n=allPx.length;

  // Tag each pixel category for debug
  for(var i=0;i<n;i++) allPx[i].cat='mid';

  // Top 3% chroma pixels -> top measurement
  var topIdx=Math.floor(n*0.97);
  var topPx=allPx.slice(topIdx);
  var topL=0,topA=0,topB=0;
  for(var i=0;i<topPx.length;i++){topL+=topPx[i].L;topA+=topPx[i].a;topB+=topPx[i].b;topPx[i].cat='top';}
  topL/=topPx.length;topA/=topPx.length;topB/=topPx.length;

  // Bottom 50% chroma -> background measurement
  var bgIdx=Math.floor(n*0.5);
  var bgPx=allPx.slice(0,bgIdx);
  var bgL=0,bgA=0,bgB=0;
  for(var i=0;i<bgPx.length;i++){bgL+=bgPx[i].L;bgA+=bgPx[i].a;bgB+=bgPx[i].b;bgPx[i].cat='bg';}
  bgL/=bgPx.length;bgA/=bgPx.length;bgB/=bgPx.length;

  // Split high-chroma pixels (chroma>15) by b-channel median -> flame (high b) / drop (low b)
  var hiC=[];
  for(var i=0;i<n;i++){if(allPx[i].c>15) hiC.push(allPx[i]);}

  var flameL,flameA,flameB,dropL,dropA,dropB;
  if(hiC.length>20){
    hiC.sort(function(a,b){return a.b-b.b;});
    var mid=Math.floor(hiC.length/2);
    var flamePx=hiC.slice(mid); // higher b = flame
    var dropPx=hiC.slice(0,mid); // lower b = drop
    flameL=0;flameA=0;flameB=0;
    for(var i=0;i<flamePx.length;i++){flameL+=flamePx[i].L;flameA+=flamePx[i].a;flameB+=flamePx[i].b;if(flamePx[i].cat!=='top')flamePx[i].cat='flame';}
    flameL/=flamePx.length;flameA/=flamePx.length;flameB/=flamePx.length;
    dropL=0;dropA=0;dropB=0;
    for(var i=0;i<dropPx.length;i++){dropL+=dropPx[i].L;dropA+=dropPx[i].a;dropB+=dropPx[i].b;if(dropPx[i].cat!=='top')dropPx[i].cat='drop';}
    dropL/=dropPx.length;dropA/=dropPx.length;dropB/=dropPx.length;
  }else{
    flameL=topL;flameA=topA;flameB=topB;
    dropL=topL;dropA=topA;dropB=topB;
  }

  // 4. Classify
  var feat={
    flame_L:flameL,flame_a:flameA,flame_b:flameB,
    drop_L:dropL,drop_a:dropA,drop_b:dropB,
    bg_L:bgL,bg_a:bgA,bg_b:bgB,
    top_L:topL,top_a:topA,top_b:topB
  };

  var clf=doClassify(feat);
  clf._raw=feat;
  clf.dbg='top=('+topA.toFixed(1)+','+topB.toFixed(0)+
    ') dr=('+dropA.toFixed(1)+','+dropB.toFixed(0)+
    ') fl=('+flameA.toFixed(1)+','+flameB.toFixed(0)+
    ') bg=('+bgA.toFixed(1)+','+bgB.toFixed(0)+
    ') H2='+clf.h2S+' H2O='+clf.h2oS+' hue='+clf.hue+(calibrated?' [CAL]':' [DEF]')+' ['+roiSource+']';
  clf._dbgGeo={cx:bCx,cy:bCy,r:bR,innerR:innerR,w:w,h:h,
    totalCircles:nCircles,brightness:Math.round(bBr),roiSource:roiSource,
    nPx:n,nTop:topPx.length,nBg:bgPx.length,nHiC:hiC.length,
    pixels:allPx};
  return clf;
}

// ===== DEBUG OVERLAY =====
function drawDebugOverlay(r){
  var g=r._dbgGeo;
  if(!g) return;
  var sc=r._scale||1;
  var inv=1/sc;
  var imgEl=document.getElementById('capturedImg');
  var dc=document.getElementById('dbgCvs');
  dc.width=cvs.width; dc.height=cvs.height;
  dc.style.display='block';
  var dx=dc.getContext('2d');
  dx.clearRect(0,0,dc.width,dc.height);

  // Draw detected circle (red) and inner circle (yellow)
  dx.strokeStyle='rgba(255,0,0,0.8)';dx.lineWidth=3;
  dx.beginPath();dx.arc(g.cx*inv,g.cy*inv,g.r*inv,0,Math.PI*2);dx.stroke();
  dx.strokeStyle='rgba(255,255,0,0.7)';dx.lineWidth=2;
  dx.beginPath();dx.arc(g.cx*inv,g.cy*inv,g.innerR*inv,0,Math.PI*2);dx.stroke();

  // Legend and stats
  dx.font='bold 14px sans-serif';
  dx.fillStyle='rgba(0,0,0,0.7)';
  dx.fillRect(4,4,220,130);
  var src=g.roiSource==='manual'?'Manual ROI':'HoughCircles: '+g.totalCircles+' found';
  dx.fillStyle='#fff';dx.fillText(src,10,20);
  dx.fillText('Center: ('+g.cx+','+g.cy+') r='+g.r+' br='+g.brightness,10,36);
  dx.fillText('innerR='+g.innerR+' (0.90x)',10,52);
  dx.fillText('Pixels: '+g.nPx+' total',10,68);
  dx.fillStyle='rgba(255,0,0,0.9)';dx.fillText('Top 3%: '+g.nTop,10,84);
  dx.fillStyle='rgba(0,0,255,0.9)';dx.fillText('BG 50%: '+g.nBg,10,100);
  dx.fillStyle='rgba(255,165,0,0.9)';dx.fillText('Flame: '+(g.nHiC>20?Math.floor(g.nHiC/2):0),10,116);
  dx.fillStyle='rgba(0,255,0,0.9)';dx.fillText('Drop: '+(g.nHiC>20?Math.ceil(g.nHiC/2):0),10,132);
}

// ===== LOAD OPENCV =====
function onReady(){
  document.getElementById('loadingScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  loadCal();
  loadROI();
  initCam();
}
var scr=document.createElement('script');
scr.src='https://docs.opencv.org/4.9.0/opencv.js';
scr.async=true;
scr.onload=function(){
  if(typeof cv!=='undefined'){
    if(cv.Mat) onReady();
    else if(cv.then) cv.then(function(o){cv=o;onReady();});
    else cv['onRuntimeInitialized']=onReady;
  }
};
scr.onerror=function(){
  document.getElementById('loadingScreen').innerHTML=
    '<p style="color:#f44336;padding:40px">Failed to load OpenCV.js<br>Check internet</p>';
};
document.head.appendChild(scr);
</script>
